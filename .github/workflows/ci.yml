name: PR quality

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CI / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: |
              python -m ruff format --check .
              python -m ruff check .
          - check: types
            command: python -m mypy
          - check: tests
            command: |
              python -m scripts.evaluate_safety
              python -m scripts.evaluate_learning
              python -m pytest
          - check: build
            command: |
              python -m build --no-isolation
              python -m pip install --no-deps --force-reinstall dist/*.whl
              python -I scripts/smoke_wheel.py
          - check: infrastructure
            command: |
              curl --fail --silent --show-error --location \
                https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 \
                --output "$RUNNER_TEMP/bicep"
              chmod +x "$RUNNER_TEMP/bicep"
              export BICEP_CLI="$RUNNER_TEMP/bicep"
              python -m unittest discover -s tests/infrastructure -v
    steps:
      - name: Check out PR merge result
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            worker/requirements.txt
      - name: Install locked dependencies and application
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r worker/requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Reject feature-to-main bypass and stale promotion evidence
        if: matrix.check == 'build'
        run: python -m scripts.release check-pr
      - name: Set up Node for package build
        if: matrix.check == 'build'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for the installed wheel
        if: matrix.check == 'build'
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}
      - name: Retain fixed-suite safety evidence even after failure
        if: always() && matrix.check == 'tests'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hard-safety-evaluation
          path: artifacts/safety-evaluation/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain synthetic preference experiment evidence
        if: always() && matrix.check == 'tests'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preference-learning-evaluation
          path: artifacts/learning-evaluation/report.json
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: CI / frontend
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend formatting, lint and types
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Test production frontend
        working-directory: frontend
        run: npm test
      - name: Retain browser acceptance and accessibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-acceptance
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 30
