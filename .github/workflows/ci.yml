name: PR quality

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CI / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: |
              python -m ruff format --check .
              python -m ruff check .
          - check: types
            command: python -m mypy
          - check: tests
            command: python -m pytest
          - check: build
            command: |
              python -m build --no-isolation
              python -m pip install --no-deps --force-reinstall dist/*.whl
              python -I scripts/smoke_wheel.py
          - check: infrastructure
            command: |
              curl --fail --silent --show-error --location \
                https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 \
                --output "$RUNNER_TEMP/bicep"
              chmod +x "$RUNNER_TEMP/bicep"
              export BICEP_CLI="$RUNNER_TEMP/bicep"
              python -m unittest discover -s tests/infrastructure -v
    steps:
      - name: Check out PR merge result
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            worker/requirements.txt
      - name: Install locked dependencies and application
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r worker/requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}
