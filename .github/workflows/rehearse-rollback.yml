name: Rehearse dev rollback

on:
  workflow_dispatch:
    inputs:
      current_run_id:
        description: Successful artifact-producing dev deployment of the current dev commit
        type: string
        required: true
      previous_run_id:
        description: Successful artifact-producing dev deployment of a different previous commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  rehearse:
    name: Rehearse dev rollback
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: dev
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: backend/src
      ASC_CURRENT_RUN_ID: ${{ inputs.current_run_id }}
      ASC_PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ASC_RESOURCE_GROUP: ${{ vars.ASC_RESOURCE_GROUP }}
      ASC_APP_NAME: ${{ vars.ASC_APP_NAME }}
      ASC_FUNCTION_APP_NAME: ${{ vars.ASC_FUNCTION_APP_NAME }}
      ASC_FOUNDRY_ACCOUNT_NAME: ${{ vars.ASC_FOUNDRY_ACCOUNT_NAME }}
      ASC_FOUNDRY_PROJECT_NAME: ${{ vars.ASC_FOUNDRY_PROJECT_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Sign in to existing dev only
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Roll back, smoke, and restore the current dev release even if rollback fails
        run: python -m scripts.release rehearse
      - name: Retain successful rehearsal evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asc-rollback-rehearsal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asc-rehearsal.json
          if-no-files-found: error
          retention-days: 90
      - name: Clear Azure login
        if: always()
        run: az logout
